*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:'Creato Display',system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
#gate{min-height:100vh;display:grid;place-items:center;padding:32px 20px;position:relative;overflow:hidden}
#gate:before{content:"";position:absolute;inset:-30% -20% auto;height:80%;background:radial-gradient(50% 55% at 50% 0%,rgba(232,88,16,.34),rgba(168,40,24,.12) 50%,transparent 78%);pointer-events:none}
.g{position:relative;width:100%;max-width:400px;display:grid;justify-items:center;text-align:center;gap:0}
.g svg{height:64px;width:auto;margin-bottom:34px}
.g .e{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#E85810;font-weight:700}
.g h1{font-weight:900;font-style:italic;text-transform:uppercase;font-size:28px;line-height:1.05;margin:12px 0 30px}
.g form{width:100%;display:grid;gap:12px}
.g input{width:100%;background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:15px 22px;color:#fff;font:500 16px 'Creato Display',sans-serif;text-align:center;outline:none;transition:border-color .18s,box-shadow .18s}
.g input:focus{border-color:#FF9030;box-shadow:0 0 0 3px rgba(255,144,48,.18)}
.g button{min-height:52px;border-radius:999px;border:2px solid #E85810;background:transparent;color:#fff;font:900 italic 15px 'Creato Display',sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;transition:all .2s cubic-bezier(.16,1,.3,1)}
.g button:hover{background:#E85810;color:#000;box-shadow:0 0 28px rgba(232,88,16,.45)}
.g button:active{transform:scale(.975)}
.g .m{min-height:20px;margin-top:6px;font-size:14px;color:#ff7a5a}
.shake{animation:sh .38s cubic-bezier(.16,1,.3,1)}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>

var u=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)});};
async function open(pw){var e=new TextEncoder();var k=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c));return new TextDecoder().decode(pt);}
function mount(html){var g=document.getElementById('gate');g.remove();var w=document.createElement('div');w.innerHTML=html;document.body.appendChild(w);w.querySelectorAll('script').forEach(function(o){var n=document.createElement('script');n.textContent=o.textContent;o.replaceWith(n);});document.title='BALLIN · Equipo';}
async function go(pw,silent){try{var h=await open(pw);try{sessionStorage.setItem('bk',pw)}catch(_){}mount(h);}catch(_){if(!silent){var m=document.getElementById('gm');m.textContent='Contraseña incorrecta';var f=document.querySelector('.g');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');document.getElementById('pw').select();}}}
document.getElementById('gf').addEventListener('submit',function(ev){ev.preventDefault();document.getElementById('gm').textContent='';go(document.getElementById('pw').value);});
try{var s=sessionStorage.getItem('bk');if(s)go(s,true);}catch(_){}
})();
